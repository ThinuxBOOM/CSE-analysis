# CSE P1 PostgreSQL settings. Installed as /etc/postgresql/17/main/conf.d/90-cse.conf by ops/provision/provision.sh.
# Data checksums are an initdb-time property (provisioning creates the cluster with --data-checksums).

# Local Unix socket only: no TCP listener at all. Only members of group 'cse' (the service users) and the
# postgres user can reach the socket; pg_hba.conf then allows peer authentication only.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
unix_socket_group = 'cse'
unix_socket_permissions = 0770

# Durability: never trade these for speed. The raw market / evidence history is irreplaceable.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica                 # keeps point-in-time recovery possible later (WAL archiving is not enabled in P1)

password_encryption = 'scram-sha-256'   # no role has a password today (peer only); future passwords must be SCRAM

timezone = 'UTC'
log_timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_connections = on
log_disconnections = on
log_lock_waits = on
