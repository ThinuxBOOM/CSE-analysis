# CSE P1 pg_hba.conf - installed as /etc/postgresql/17/main/pg_hba.conf by ops/provision/provision.sh
# (@DBNAME@ is replaced with the database name, default 'cse').
#
# Local Unix-socket connections only, peer authentication only. There are deliberately NO 'host' / 'hostssl'
# lines: the server does not listen on TCP (listen_addresses = '') and nothing may authenticate with a password.
#
# TYPE  DATABASE   USER       METHOD
local   all        postgres   peer
local   @DBNAME@   all        peer map=cse
# everything else is rejected (no matching line)
