# CSE P1 pg_ident.conf - installed as /etc/postgresql/17/main/pg_ident.conf by ops/provision/provision.sh.
# Maps each service OS user to exactly one PostgreSQL role (peer authentication, map=cse).
# cse_owner and cse_reader are NOLOGIN and have no mapping. The postgres OS user uses its own 'postgres' line.
#
# MAPNAME   SYSTEM-USERNAME   PG-USERNAME
cse         cse-worker        cse_worker
cse         cse-backup        cse_backup
cse         cse-migrator      cse_migrator
