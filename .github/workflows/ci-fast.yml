# Fast regression (docs/CI_TEST_STRATEGY.md, workflow A).
#
# Every tests/test_*.py file in one pytest run on Linux, in the tracked test container (.github/ci/linux.Dockerfile)
# started with --network none and no PostgreSQL configured. The offline-safe unit, static, determinism, leakage and
# pin-integrity tests execute; the PostgreSQL, database-URL and evidence-corpus suites skip by their own gates and run
# in ci-regression.yml instead. No CSE request is possible (no network), no secret is used, nothing is written outside
# the run's own artifacts.
name: CI fast (offline suite)

on:
  push:
    branches: [claude/rf4-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline:
    name: Offline suite (Linux, no network, no PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the report directory
        run: |
          OUT="$RUNNER_TEMP/reports/ci-fast-offline"
          mkdir -p "$OUT" && chmod 777 "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Check the test-group partition
        run: python3 .github/ci/groups.py --check

      - name: Build the test container
        run: |
          for try in 1 2 3; do
            if docker build -t cse-ci-linux -f .github/ci/linux.Dockerfile .github/ci > "$OUT/docker-build.log" 2>&1; then
              exit 0
            fi
            echo "docker build failed (try $try)"; sleep 30
          done
          tail -n 60 "$OUT/docker-build.log"
          exit 1

      - name: Run every test file offline
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm --network none -e GIT_SHA -e GIT_HEAD_SHA -v "$PWD:/src:ro" -v "$OUT:/out" \
            cse-ci-linux bash /src/.github/ci/linux_container.sh offline /out

      - name: Summarise
        if: always()
        run: python3 .github/ci/summarize.py "$(dirname "$OUT")" "$OUT/summary.json" offline

      - name: Upload the reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fast-offline
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
